general {
    hide_cursor = false
}
background {
    monitor =
    path = $HYPRLOCK_WALLPAPER
    color = rgba(171020ff)
    blur_passes = 2
}
label {
    monitor =
    text = $TIME
    color = rgba(ede3f5ff)
    font_size = 96
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(b4a3c4ff)
    font_size = 18
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    rounding = 16
    outer_color = rgba(cf5affff) rgba(a69bffff) 45deg
    inner_color = rgba(241a30ff)
    font_color = rgba(ede3f5ff)
    check_color = rgba(a8cfa0ff)
    fail_color = rgba(ff799dff)
    font_family = Inter
    placeholder_text = <i>Password to unlock</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -50
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(b4a3c4ff)
    font_size = 13
    font_family = Inter
    position = 0, -105
    halign = center
    valign = center
}

# Music below the password field; empty labels hide when playback stops.
image {
    monitor =
    path = ~/.cache/violet-lock-music/empty.png
    size = 120
    rounding = 14
    border_size = 0
    reload_time = 2
    reload_cmd = python3 ~/.scripts/lock-music.py art
    position = -210, -220
    halign = center
    valign = center
    onclick = python3 ~/.scripts/bar-music.py play-pause
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py title
    color = rgba(ede3f5ff)
    font_size = 19
    font_family = Inter
    position = 80, -173
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py artist
    color = rgba(b4a3c4ff)
    font_size = 13
    font_family = Inter
    position = 80, -207
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py previous
    color = rgba(cf5affff)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 10, -257
    halign = center
    valign = center
    onclick = python3 ~/.scripts/bar-music.py previous
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py play
    color = rgba(ede3f5ff)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 80, -257
    halign = center
    valign = center
    onclick = python3 ~/.scripts/bar-music.py play-pause
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py next
    color = rgba(cf5affff)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 150, -257
    halign = center
    valign = center
    onclick = python3 ~/.scripts/bar-music.py next
}
label {
    monitor =
    text = cmd[update:1000] python3 ~/.scripts/lock-music.py hint
    color = rgba(b4a3c4ff)
    font_size = 11
    font_family = Inter
    position = 0, -325
    halign = center
    valign = center
}
