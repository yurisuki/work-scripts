<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>Inter</family>
    <accept><family>Noto Sans</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>
</fontconfig>
