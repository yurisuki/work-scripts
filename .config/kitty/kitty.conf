# Violet Night — shared palette with the existing Konsole theme.
font_family JetBrainsMono Nerd Font
font_size 11.5
shell zsh
window_padding_width 14
background #171020
foreground #ede3f5
selection_background #71358f
selection_foreground #fff7ff
cursor #cf5aff
cursor_text_color #171020
url_color #a69bff
background_opacity 0.97
hide_window_decorations yes
enable_audio_bell no
confirm_os_window_close -1
tab_bar_style powerline
active_tab_background #cf5aff
active_tab_foreground #171020
inactive_tab_background #241a30
inactive_tab_foreground #b4a3c4
color0 #241a30
color1 #ff799d
color2 #a8cfa0
color3 #ebc28b
color4 #a69bff
color5 #cf5aff
color6 #b3a0db
color7 #ede3f5
color8 #776387
color9 #ffa0b8
color10 #c4e7bc
color11 #ffdbaa
color12 #c5bdff
color13 #e59bff
color14 #d2c1f3
color15 #fff7ff
